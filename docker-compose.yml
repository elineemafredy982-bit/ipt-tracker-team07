services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ipt_tracker
      POSTGRES_USER: ipt
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ipt}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipt -d ipt_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/ipt_tracker
      DB_USERNAME: ipt
      DB_PASSWORD: ${DB_PASSWORD:-ipt}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file (see .env.example)}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
    ports:
      - "8080:8080"

volumes:
  pgdata:
