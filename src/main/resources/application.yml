server:
  port: ${PORT:8080}

spring:
  application:
    name: ipt-tracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ipt_tracker}
    username: ${DB_USERNAME:ipt}
    password: ${DB_PASSWORD:ipt}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
